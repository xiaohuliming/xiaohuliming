name: recent-activity

on:
  push:
    branches: [main]
    paths:
      - scripts/activity_graph.py
      - .github/workflows/activity.yml
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build recent activity
        env:
          GH_USER: xiaohuliming
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/recent_activity.py
      - name: Build contribution graph
        env:
          GH_USER: xiaohuliming
        run: python3 scripts/activity_graph.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg assets/activity-graph.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: update activity cards [skip ci]"
            git pull --rebase origin main
            git push
          fi
